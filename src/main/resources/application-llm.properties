# ========================
# Anthropic Claude API
# ========================
external.anthropic.base-url=https://api.anthropic.com
external.anthropic.api-key=${EXTERNAL_ANTHROPIC_API_KEY}
external.anthropic.version=2023-06-01

external.anthropic.model.cheap=claude-haiku-4-5
external.anthropic.model.quality=claude-sonnet-4-6

external.anthropic.connect-timeout=5000
external.anthropic.read-timeout=120000

# api or cli
external.llm.provider=${EXTERNAL_LLM_PROVIDER:api}

# cli
external.llm.cli.path=${CLAUDE_CLI_PATH:claude}
external.llm.cli.model.cheap=haiku
external.llm.cli.model.quality=sonnet
external.llm.cli.timeout-ms=180000

reflection.allowed-user-id=${REFLECTION_OWNER_ID:}